name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ─── Stage 1: Verify (must pass before any release artifact is built) ───
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: makefile
          - os: ubuntu-latest
            build: cmake
          - os: macos-latest
            build: cmake
          - os: windows-latest
            build: cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libyaml (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libyaml

      - name: Cache vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: vcpkg install

      - name: Makefile build & test
        if: matrix.build == 'makefile'
        run: make && make test

      - name: CMake configure
        if: matrix.build == 'cmake'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        if: matrix.build == 'cmake'
        run: cmake --build build -j --config Release

      - name: CMake test
        if: matrix.build == 'cmake'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  # ─── Stage 2: Build release artifacts for each platform ─────────────────
  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-arm64
            os: ubuntu-latest
            arch: aarch64
            cross: true
          - name: macos-arm64
            os: macos-latest
            arch: aarch64
          - name: windows-x64
            os: windows-latest
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross-compiler (ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install libyaml (macOS)
        if: runner.os == 'macOS'
        run: brew install libyaml

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install

      # ── Build static + shared library ──
      - name: CMake configure (native)
        if: "!matrix.cross"
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCLOG_BUILD_SHARED=ON
          -DCLOG_BUILD_TESTS=OFF
          -DCLOG_BUILD_EXAMPLES=OFF

      - name: CMake configure (cross ARM64)
        if: matrix.cross
        run: |
          cat > /tmp/aarch64-toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/aarch64-toolchain.cmake \
            -DCLOG_BUILD_SHARED=ON \
            -DCLOG_BUILD_TESTS=OFF \
            -DCLOG_BUILD_EXAMPLES=OFF

      - name: CMake build
        run: cmake --build build -j --config Release

      # ── Package with CPack ──
      - name: Package (tar.gz + DEB + RPM)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          cd build && cpack -G TGZ -G DEB -G RPM

      - name: Package (tar.gz only, cross-compiled)
        if: runner.os == 'Linux' && matrix.cross
        run: |
          cd build && cpack -G TGZ

      - name: Package (tar.gz + ZIP)
        if: runner.os == 'macOS'
        run: |
          cd build && cpack -G TGZ -G ZIP

      - name: Package (ZIP)
        if: runner.os == 'Windows'
        run: |
          cd build && cpack -G ZIP

      # ── Collect artifacts ──
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.arch }}"
          PKG_BASE="clogx-${VERSION}-${{ matrix.name }}"

          # Static library
          cp build/libclogx.a "dist/${PKG_BASE}.tar.gz" 2>/dev/null || true
          cp build/libclogx.a "dist/${PKG_BASE}.a" 2>/dev/null || true

          # Shared library
          cp build/libclogx.so "dist/${PKG_BASE}.so" 2>/dev/null || true
          cp build/libclogx.dylib "dist/${PKG_BASE}.dylib" 2>/dev/null || true

          # Windows
          cp build/Release/clogx.lib "dist/${PKG_BASE}.lib" 2>/dev/null || true
          cp build/Release/clogx.dll "dist/${PKG_BASE}.dll" 2>/dev/null || true

          # Package archives from CPack
          find build -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;

          # pkg-config
          cp build/clogx.pc "dist/${PKG_BASE}.pc" 2>/dev/null || true

          # Headers
          tar czf "dist/${PKG_BASE}-headers.tar.gz" include/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: dist/

  # ─── Stage 3: Create GitHub Release ─────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: artifacts-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              gsub(/[\[\]]/, "")
              if ($2 == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          # Fallback to git log if no CHANGELOG section found
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for v${VERSION}, using git log" >&2
            PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF_NAME}$" | tail -1)
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_REF_NAME" ]; then
              git log "${PREV_TAG}..${GITHUB_REF_NAME}" --oneline > /tmp/release-notes.md
            else
              git log --oneline -20 > /tmp/release-notes.md
            fi
          fi

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.a
            artifacts/**/*.so
            artifacts/**/*.dylib
            artifacts/**/*.lib
            artifacts/**/*.dll
            artifacts/**/*.pc
