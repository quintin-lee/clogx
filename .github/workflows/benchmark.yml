name: Benchmark CI

on:
  schedule:
    # Run every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'core/**'
      - 'sinks/**'
      - 'benchmarks/**'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    env:
      CLOG_BENCH_THRESHOLD: '30'
      CLOG_BASELINE_FILE: benchmarks/.baseline

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev

      - name: Build benchmarks
        run: make benchmark

      # The committed benchmarks/.baseline is the reference of record — it is
      # checked out above and used directly for the regression comparison.
      # Refresh it locally with `make benchmark-baseline`, then commit.
      - name: Measure throughput and check regression
        run: |
          scripts/benchmark_check.sh \
            --results /tmp/bench_curr.txt \
            --baseline "$CLOG_BASELINE_FILE" \
            --threshold "$CLOG_BENCH_THRESHOLD"

      - name: Generate Benchmark Summary
        if: always()
        run: |
          echo "## 🚀 Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat /tmp/bench_curr.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
