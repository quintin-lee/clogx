name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: makefile
          - os: ubuntu-latest
            build_type: cmake
          - os: macos-latest
            build_type: cmake
          - os: windows-latest
            build_type: cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libyaml (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libyaml

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install yaml-cpp openssl

      - name: Build with Makefile
        if: matrix.build_type == 'makefile' && matrix.os != 'windows-latest'
        run: make

      - name: Run tests with Makefile
        if: matrix.build_type == 'makefile' && matrix.os != 'windows-latest'
        run: make test

      - name: Configure with CMake
        if: matrix.build_type == 'cmake'
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with CMake
        if: matrix.build_type == 'cmake'
        run: cmake --build build -j

      - name: Run tests with CMake
        if: matrix.build_type == 'cmake'
        run: ctest --test-dir build --output-on-failure

      - name: Verify compile_commands.json
        if: matrix.build_type == 'cmake'
        run: test -f build/compile_commands.json

  asan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test with ASan
        run: |
          make clean
          make test CC=clang CFLAGS='-std=c99 -Wall -Wextra -Iinclude -O2 -D_GNU_SOURCE -fsanitize=address -fno-omit-frame-pointer'

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build all tests
        run: |
          make
          for f in tests/test_*.c tests/verify_config.c; do \
            make "build/$(basename "$f" .c)" || exit 1; \
          done

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run tests under valgrind
        run: |
          for t in build/test_*; do \
            valgrind --error-exitcode=1 --leak-check=full --track-origins=yes "./$t"; \
          done

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        # warning/performance/portability only: --enable=all flags public API as unusedFunction
        run: >
          cppcheck --enable=warning,performance,portability
          --error-exitcode=1 --inline-suppress
          --suppress=missingIncludeSystem
          -I include include/ core/ sinks/

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: make check-format

  coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with coverage
        run: |
          CC=clang CFLAGS="--coverage -fprofile-arcs -ftest-coverage" \
          make clean && make

      - name: Run tests with coverage
        run: |
          make test
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info 'tests/*' --output-file coverage.info

      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.info
          flag: lcov
