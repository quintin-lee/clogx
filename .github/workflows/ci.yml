name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: makefile
          - os: ubuntu-latest
            build_type: cmake
          - os: macos-latest
            build_type: cmake
          - os: windows-latest
            build_type: cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libyaml (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libyaml

      - name: Cache vcpkg binaries
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: vcpkg install

      - name: Build with Makefile
        if: matrix.build_type == 'makefile' && matrix.os != 'windows-latest'
        run: make

      - name: Run tests with Makefile
        if: matrix.build_type == 'makefile' && matrix.os != 'windows-latest'
        run: make test

      - name: Configure with CMake
        if: matrix.build_type == 'cmake'
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with CMake
        if: matrix.build_type == 'cmake'
        run: cmake --build build -j

      - name: Run tests with CMake
        if: matrix.build_type == 'cmake'
        run: |
          mkdir -p logs
          ctest --test-dir build -C Debug --output-on-failure --timeout 120

      - name: Verify compile_commands.json
        if: matrix.build_type == 'cmake' && matrix.os != 'windows-latest'
        run: test -f build/compile_commands.json

  asan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test with ASan
        run: |
          make clean
          make test CC=clang CFLAGS='-std=c99 -Wall -Wextra -Iinclude -O2 -D_GNU_SOURCE -fsanitize=address -fno-omit-frame-pointer'

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build all tests
        run: |
          make
          for f in tests/test_*.c tests/verify_config.c; do \
            make "build/$(basename "$f" .c)" || exit 1; \
          done

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run tests under valgrind
        run: |
          for t in build/test_*; do \
            valgrind --error-exitcode=1 --leak-check=full --track-origins=yes "./$t"; \
          done

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell script syntax
        run: |
          set -e
          for f in scripts/*.sh; do
            bash -n "$f"
          done

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version references match VERSION
        run: ./scripts/check_version_consistency.sh

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libyaml-dev

      - name: Run clang-tidy static analysis
        run: make check-tidy

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: make check-format

  coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev lcov

      - name: Build with coverage
        run: |
          make clean && make CC=gcc CFLAGS="-std=c99 -Wall -Wextra -Iinclude -O0 -g -D_GNU_SOURCE --coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" EXTRA_LDFLAGS="--coverage"

      - name: Run tests with coverage
        run: |
          make test CC=gcc CFLAGS="-std=c99 -Wall -Wextra -Iinclude -O0 -g -D_GNU_SOURCE --coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" EXTRA_LDFLAGS="--coverage"
          ./scripts/gcov_branch_summary.sh build 75.0
          lcov --capture --rc branch_coverage=1 --ignore-errors unused,negative,empty --directory build --output-file coverage.info || lcov --capture --rc branch_coverage=1 --directory build --output-file coverage.info
          lcov --remove coverage.info 'tests/*' 'deps/*' 'example/*' 'benchmarks/*' 'fuzz/*' 'include/*' --rc branch_coverage=1 --ignore-errors unused,negative,empty --output-file coverage.info || lcov --remove coverage.info 'tests/*' --rc branch_coverage=1 --output-file coverage.info
          lcov --summary coverage.info --rc branch_coverage=1 --ignore-errors unused,negative,empty || true

      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.info
          flag: lcov

  tls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev libssl-dev openssl

      - name: Build with Makefile (TLS enabled)
        run: make clean && make TLS=1

      - name: Run TLS tests with Makefile
        run: make test TLS=1

      - name: Configure with CMake (TLS enabled)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCLOG_ENABLE_TLS=ON

      - name: Build with CMake (TLS enabled)
        run: cmake --build build -j

      - name: Run TLS tests with CMake
        run: |
          mkdir -p logs
          ctest --test-dir build -C Debug --output-on-failure --timeout 120

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev

      - name: Build and test fuzz targets
        run: |
          make fuzz-build
          echo test | ./build/fuzz_config /dev/stdin
          echo test | ./build/fuzz_formatter /dev/stdin
          echo test | ./build/fuzz_pipeline /dev/stdin
