repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        language: system
        entry: clang-format -i
        types: [c, h]
        pass_filenames: true

      - id: cmake-format
        name: cmake-format
        language: system
        entry: cmake-format -i
        types: [cmake]
        pass_filenames: true
